<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img" aria-label="Netgear R7000 running OpenWrt 25.12">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="0.55" stop-color="#101a2c"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="980" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="978" height="298" rx="18" fill="none" stroke="#22304a"/>
  <!-- antennas -->
  <g stroke="#3d5680" stroke-width="8" stroke-linecap="round">
    <line x1="62" y1="86" x2="34" y2="12"/>
    <line x1="96" y1="86" x2="96" y2="6"/>
    <line x1="130" y1="86" x2="158" y2="12"/>
  </g>
  <circle cx="34" cy="12" r="5" fill="#58a6ff" filter="url(#glow)"/>
  <circle cx="96" cy="6" r="5" fill="#7ee787" filter="url(#glow)"/>
  <circle cx="158" cy="12" r="5" fill="#58a6ff" filter="url(#glow)"/>
  <!-- body -->
  <g transform="translate(30,86)">
    <path d="M0 34 L160 34 L160 86 Q160 98 148 98 L12 98 Q0 98 0 86 Z" fill="#16233a" stroke="#2b4062"/>
    <path d="M0 34 L160 34 L148 20 L12 20 Z" fill="#1b2c48" stroke="#2b4062"/>
    <text x="14" y="58" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#e6edf3">NETGEAR</text>
    <rect x="14" y="70" width="132" height="5" rx="2.5" fill="#58a6ff" opacity="0.85"/>
    <circle cx="22" cy="88" r="3" fill="#7ee787"/>
    <circle cx="34" cy="88" r="3" fill="#58a6ff"/>
    <rect x="100" y="83" width="44" height="9" rx="2" fill="#0f1a2b" stroke="#2b4062"/>
    <!-- wifi waves -->
    <g fill="none" stroke-linecap="round">
      <path d="M196 62 a14 14 0 0 1 0 20" stroke="#58a6ff" stroke-width="3" opacity="0.9"/>
      <path d="M206 54 a26 26 0 0 1 0 36" stroke="#58a6ff" stroke-width="3" opacity="0.55"/>
      <path d="M216 46 a38 38 0 0 1 0 52" stroke="#7ee787" stroke-width="3" opacity="0.3"/>
    </g>
  </g>
  <!-- text -->
  <text x="286" y="98" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="44" font-weight="700" fill="#e6edf3">NETGEAR R7000</text>
  <text x="286" y="136" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="20" fill="#9fc4ff">Nighthawk AC1900 — 2013 hardware, 2026 OpenWrt</text>
  <text x="286" y="170" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="14" fill="#8b98a9">AdGuard Home · Tailscale · WireGuard · SQM · SMB3 · aria2 · stats</text>
  <g transform="translate(286,186)" font-family="system-ui,sans-serif" font-size="12">
    <rect x="0" y="0" width="106" height="24" rx="12" fill="#12233a" stroke="#2d4a72"/>
    <text x="11" y="16" fill="#7ee787">OpenWrt 25.12</text>
    <rect x="116" y="0" width="124" height="24" rx="12" fill="#12233a" stroke="#2d4a72"/>
    <text x="127" y="16" fill="#58a6ff">b43-next AC-PHY</text>
    <rect x="250" y="0" width="104" height="24" rx="12" fill="#12233a" stroke="#2d4a72"/>
    <text x="261" y="16" fill="#d29922">87 MB overlay</text>
    <rect x="364" y="0" width="96" height="24" rx="12" fill="#12233a" stroke="#2d4a72"/>
    <text x="375" y="16" fill="#bc8cff">no wl blob</text>
  </g>
  <text x="286" y="262" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="13" fill="#8b98a9">github.com/ImAthanasia/netgear-r7000-modern-openwrt · radios off until you start them</text>
  <!-- resurrect arrow -->
  <g transform="translate(852,62)" filter="url(#glow)">
    <path d="M34 4 A32 32 0 1 1 2 22" fill="none" stroke="url(#acc)" stroke-width="7" stroke-linecap="round"/>
    <path d="M40 22 L30 34 L20 21 Z" fill="#7ee787"/>
  </g>
  <text x="900" y="128" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#7ee787">2013</text>
  <text x="900" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#9fc4ff">→ 2026</text>
</svg>
